follower/controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: position_controllers/GripperActionController

follower/joint_state_broadcaster:
  ros__parameters:
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_flex_joint,
             wrist_flex_joint, wrist_roll_joint, gripper_jaw_joint]

follower/joint_trajectory_controller:
  ros__parameters:
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: true
    allow_partial_joints_goal: false
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_flex_joint,
             wrist_flex_joint, wrist_roll_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

follower/gripper_controller:
  ros__parameters:
    joint: gripper_jaw_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]

# leader: только joint_state_broadcaster
leader/controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

leader/joint_state_broadcaster:
  ros__parameters:
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_flex_joint,
             wrist_flex_joint, wrist_roll_joint, gripper_jaw_joint]