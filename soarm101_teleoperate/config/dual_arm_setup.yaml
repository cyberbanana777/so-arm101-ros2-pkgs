# positions zero_point_link for each arm in the world
world:
  leader:
    translation:
      x: -0.5
      y: 0.0
      z: 0.0
    rotation:
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
  follower:
    translation:
      x: 0.5
      y: 0.0
      z: 0.0
    rotation:
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

# MArkers for identification arms (link to zero_point_link)
markers:
  leader:
    text: "Leader"
    color: [0.0, 1.0, 0.0, 1.0]
    offset_z: 0.4
    shape: "diamond"
    diamond_size: 0.05
  follower:
    text: "Follower"
    color: [0.0, 0.0, 1.0, 1.0]
    offset_z: 0.4
    shape: "diamond"
    diamond_size: 0.05